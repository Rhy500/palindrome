<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Check kata tersebut palindrome</h1>
    <main>
      <div class="palindrome-input">
        <label for="text-input">Enter in text to check for a palindrome:</label>
        <input type="text" id = "text-input" />
        <button id="check-btn">Check</button>
      </div>
	  <br/>
      <div class="palindrome-dev">
        <p>Enter you text or you verb , to check it is palindrome or not.</p>
        <span role="img" aria-label="light-bulb">&#128161;</span>
		</p>
      </div>

      <div id="result"></div>
	  
    </main>
	<script src="script.js"></script>
  </body>
</html>
